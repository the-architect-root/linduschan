<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="mascotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Mascot body - friendly blob character -->
  <ellipse cx="100" cy="120" rx="60" ry="50" fill="url(#mascotGradient)" filter="url(#glow)"/>
  
  <!-- Eyes -->
  <ellipse cx="80" cy="110" rx="12" ry="15" fill="#1a1a2e"/>
  <ellipse cx="120" cy="110" rx="12" ry="15" fill="#1a1a2e"/>
  
  <!-- Eye highlights -->
  <circle cx="84" cy="105" r="4" fill="white"/>
  <circle cx="124" cy="105" r="4" fill="white"/>
  
  <!-- Smile -->
  <path d="M 75 135 Q 100 155 125 135" stroke="#1a1a2e" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Antenna/feather -->
  <path d="M 100 70 Q 100 40 85 20" stroke="#e94560" stroke-width="3" fill="none"/>
  <circle cx="85" cy="20" r="6" fill="#e94560"/>
  
  <!-- Floating sparkles -->
  <circle cx="40" cy="60" r="3" fill="#e94560" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="80" r="4" fill="#533483" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="150" r="2" fill="#e94560" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="160" r="3" fill="#533483" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
